<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NOKHBA CHAT</title>
<style>
*{box-sizing:border-box;font-family:sans-serif}
body{margin:0;background:#0f1115;color:#fff;display:flex;height:100vh;overflow:hidden}
.sidebar{width:260px;background:#14161c;border-left:1px solid #222;display:flex;flex-direction:column}
.logo{padding:18px;font-size:22px;font-weight:900;text-align:center}
.logo span{color:#a855f7}
.search{margin:0 12px 12px;background:#1e2128;padding:10px 12px;border-radius:10px;color:#888;font-size:13px}
.group-title{padding:0 15px 8px;font-size:12px;color:#888}
.group{margin:0 10px;padding:11px 12px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:center}
.group.active{background:#2a1a3a;border:1px solid #7c3aed}
.group .icon{width:32px;height:32px;background:#7c3aed;border-radius:8px;display:grid;place-items:center}
.group small{display:block;color:#888;font-size:11px}
.user{margin-top:auto;padding:14px;border-top:1px solid #222;display:flex;gap:10px;align-items:center}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#ec4899);display:grid;place-items:center;font-weight:900}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{padding:14px 18px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.top b{font-size:18px}.top small{color:#888}
#chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:10px}
.msg .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:900;flex-shrink:0}
.bubble{max-width:70%}
.bubble .name{font-size:12px;color:#a855f7;margin-bottom:4px}
.bubble .text{background:#1e2128;padding:10px 13px;border-radius:12px;line-height:1.5;word-break:break-word}
.me{flex-direction:row-reverse}.me .text{background:#7c3aed}
#form{display:flex;gap:10px;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#14161c}
#form input{flex:1;min-width:0;background:#1e2128;border:none;outline:none;color:#fff;padding:13px 15px;border-radius:25px}
#form button{background:#7c3aed;border:none;color:#fff;padding:12px 18px;border-radius:25px;font-weight:900;cursor:pointer}
.members{width:220px;background:#14161c;border-right:1px solid #222;padding:15px}
.member{display:flex;gap:10px;align-items:center;padding:8px 0}
.dot{width:8px;height:8px;background:#22c55e;border-radius:50%}
@media(max-width:800px){.members,.sidebar{display:none}}
</style>
</head>
<body>
<div class="sidebar">
<div class="logo">NOKHBA <span>CHAT</span></div>
<div class="search">🔍 قلب على مجموعة...</div>
<div class="group-title">المجموعات</div>
<div class="group active" onclick="switchRoom(this,'العام')"><div class="icon">#</div><div><b>العام</b><small>3 أعضاء متصلين</small></div></div>
<div class="group" onclick="switchRoom(this,'الألعاب')"><div class="icon" style="background:#ec4899">🎮</div><div><b>الألعاب</b><small>12 عضو</small></div></div>
<div class="group" onclick="switchRoom(this,'الميمز')"><div class="icon" style="background:#f59e0b">😂</div><div><b>الميمز</b><small>48 عضو</small></div></div>
<div class="group" onclick="switchRoom(this,'الموسيقى')"><div class="icon" style="background:#22c55e">🎵</div><div><b>الموسيقى</b><small>7 عضو</small></div></div>
<div class="user"><div class="avatar">A</div><div><b>ayoub</b><div style="font-size:11px;color:#22c55e">● متصل</div></div></div>
</div>
<div class="main">
<div class="top"><div><b id="roomName"># العام</b><br><small>3 أعضاء متصلين</small></div><div>👥</div></div>
<div id="chat"></div>
<form id="form"><input id="input" placeholder="كتب رسالة لـ # العام..." autocomplete="off"><button>➤</button></form>
</div>
<div class="members"><b>الأعضاء — 3</b><div class="member"><div class="avatar" style="width:32px;height:32px;font-size:13px">A</div>ayoub <span class="dot"></span></div><div class="member"><div class="avatar" style="width:32px;height:32px;font-size:13px;background:#22c55e">S</div>salma <span class="dot"></span></div><div class="member"><div class="avatar" style="width:32px;height:32px;font-size:13px;background:#f59e0b">Y</div>yassine <span class="dot"></span></div></div>
<script>
let current='العام';
let all={};
try{all=JSON.parse(localStorage.getItem('nokhba_full')||'{}')}catch(e){all={}}
if(!all['العام']) all['العام']=[{name:'salma',text:'أهلا أولد النخبة، مرحبا بيك فـ NOKHBA CHAT 👑',color:'#22c55e',me:false},{name:'ayoub',text:'هادا حسن من PARADOX',color:'#a855f7',me:true}];
const chat=document.getElementById('chat');
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
 chat.innerHTML='';
 (all[current]||[]).forEach(m=>{
  const d=document.createElement('div'); d.className='msg '+(m.me?'me':'');
  d.innerHTML=`<div class="av" style="background:${m.color}">${esc(m.name[0].toUpperCase())}</div><div class="bubble"><div class="name">${esc(m.name)}</div><div class="text">${esc(m.text)}</div></div>`;
  chat.appendChild(d);
 }); chat.scrollTop=chat.scrollHeight;
 try{localStorage.setItem('nokhba_full',JSON.stringify(all))}catch(e){}
}
function switchRoom(el,name){document.querySelectorAll('.group').forEach(g=>g.classList.remove('active'));el.classList.add('active');current=name;document.getElementById('roomName').innerText='# '+name;document.getElementById('input').placeholder='كتب رسالة لـ # '+name+'...';if(!all[current])all[current]=[];render();}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const inp=document.getElementById('input');const t=inp.value.trim();if(!t)return;if(!all[current])all[current]=[];all[current].push({name:'ayoub',text:t,color:'#a855f7',me:true});render();inp.value='';setTimeout(()=>{const reps=['واخا فهمتك 😂','بصح أولد النخبة','هادي واعرة','كمل كمل','NOKHBA ديما الفوق 👑'];all[current].push({name:'salma',text:reps[Math.floor(Math.random()*reps.length)],color:'#22c55e',me:false});render();},700);});
render();
</script>
</body>
</html>
